[project]
name = "agent-governance-loop"
version = "0.1.0"
requires-python = ">=3.12"
authors = [{ name = "Harpreet S. Siddhu" }]
dependencies = [
  "aws-cdk-lib>=2.273.0,<3",
  "constructs>=10.0.0,<11",
  "boto3>=1.40",
  "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.17", "cdk-nag>=3,<4"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110
# Scripts and stacks import each other as plain modules from these folders.
src = ["infra", "scripts"]
extend-exclude = ["build", "cdk.out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
